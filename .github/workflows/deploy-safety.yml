name: Deploy safety

# Every merge to main deploys, so each PR must work with the code already
# running: app builds open in browsers, and backend tasks still serving
# while a deploy rolls out. These checks flag changes that break them.
# A label overrides a check once nothing running still uses the old shape;
# see apps/api/AGENTS.md.
#
# Its own workflow so that adding or removing a label re-runs just these
# checks.

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions:
  contents: read

env:
  # Update both together; the hash is the linux_amd64 tarball's line in the
  # release's checksums.txt.
  OASDIFF_VERSION: "1.33.0"
  OASDIFF_SHA256: "43a4e328e2d13ba1552d760aa68d2485c75c5621f309f6ff64ae895188345247"

jobs:
  api-breaking:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # Needs the base branch to compare against.
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Install oasdiff
        run: |
          mkdir -p "$HOME/.local/bin"
          tarball="$RUNNER_TEMP/oasdiff.tar.gz"
          curl -fsSL -o "$tarball" "https://github.com/oasdiff/oasdiff/releases/download/v${OASDIFF_VERSION}/oasdiff_${OASDIFF_VERSION}_linux_amd64.tar.gz"
          echo "${OASDIFF_SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$HOME/.local/bin" oasdiff
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check tests
        run: npm test --workspace @doenet-tools/api -- --run scripts/contract

      - name: Check for breaking API changes
        env:
          ALLOW_BREAKING: ${{ contains(github.event.pull_request.labels.*.name, 'api-breaking') && '1' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: npm run contract:check-breaking --workspace @doenet-tools/api -- --base "origin/$BASE_REF"

  db-destructive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version-file: ".nvmrc"
          cache: npm

      - run: npm ci

      - name: Check for destructive migrations
        env:
          ALLOW_DESTRUCTIVE: ${{ contains(github.event.pull_request.labels.*.name, 'db-destructive') && '1' || '' }}
          BASE_REF: ${{ github.base_ref }}
        run: npm run db:check-migrations --workspace @doenet-tools/api -- --base "origin/$BASE_REF"
